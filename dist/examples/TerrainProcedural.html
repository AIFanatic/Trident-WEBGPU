
    <!DOCTYPE html>
    <html>
        <head>
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
            <meta name="mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta charset="UTF-8">
            
            <style>
                html, body {
                    margin: 0;
                    overflow: hidden;
                    width: 100%;
                    height: 100%;
                }
            </style>
        </head>
        <body>
            <script type="importmap">
                {
                    "imports": {
                        "@trident/core": "../trident-core.js",
                        "@trident/plugins/": "../plugins/"
                    }
                }
            </script>
            <script type="module">
                const canvas = document.createElement("canvas");
                document.body.appendChild(canvas);
                            import { PlayerRuntime, GameObject, Components, Mathf, Runtime, GPU, Component, PBRMaterial, Geometry, Serializer, Prefab } from '@trident/core';
            import { OrbitControls } from '@trident/plugins/OrbitControls.js';
            import { Terrain } from '@trident/plugins/Terrain/Terrain.js';
            import { Debugger } from '@trident/plugins/Debugger.js';
            import { Sky } from '@trident/plugins/Environment/Sky.js';
            import { IBLLightingPass } from '@trident/plugins/Environment/IBLLightingPass.js';
            import { SkyboxPass } from '@trident/plugins/Environment/SkyboxPass.js';
            import { WaterNoise } from '@trident/plugins/Water/WaterNoise.js';
            import { UIFolder, UISliderStat, UITextureViewer } from '@trident/plugins/ui/UIStats.js';
            import { TerrainProcedural } from '@trident/plugins/TerrainProcedural.js';
            import { GLTFLoader } from '@trident/plugins/GLTF/GLTFLoader.js';
            import { TerrainProceduralProp } from '@trident/plugins/TerrainProceduralProp.js';
            import { LODGroup } from '@trident/plugins/LOD/LODGroup.js';
            import { InstancedLODGroup } from '@trident/plugins/LOD/InstancedLODGroup.js';
            
            async function Application(canvas) {
              await PlayerRuntime.Create(canvas);
              const scene = PlayerRuntime.SceneManager.CreateScene("DefaultScene");
              PlayerRuntime.SceneManager.SetActiveScene(scene);
              const mainCameraGameObject = new GameObject();
              mainCameraGameObject.transform.position.set(0, 0, -15);
              mainCameraGameObject.name = "MainCamera";
              const camera = mainCameraGameObject.AddComponent(Components.Camera);
              camera.SetPerspective(72, canvas.width / canvas.height, 0.5, 1e4);
              mainCameraGameObject.transform.position.set(0, 0, 1e3);
              mainCameraGameObject.transform.LookAtV1(new Mathf.Vector3(0, 0, 0));
              const controls = mainCameraGameObject.AddComponent(OrbitControls);
              const lightGameObject = new GameObject();
              lightGameObject.transform.position.set(-4, 4, -4);
              lightGameObject.transform.LookAtV1(new Mathf.Vector3(0, 0, 0));
              const light = lightGameObject.AddComponent(Components.DirectionalLight);
              light.intensity = 2;
              const skyAtmosphere = new Sky();
              await skyAtmosphere.init();
              const skycubemap = skyAtmosphere.skyTextureCubemap;
              const iblLightingPass = Runtime.Renderer.RenderPipeline.AddPass(IBLLightingPass, GPU.RenderPassOrder.AfterLighting);
              const skyboxPass = Runtime.Renderer.RenderPipeline.AddPass(SkyboxPass, GPU.RenderPassOrder.AfterLighting);
              iblLightingPass.SetEnvironment(skycubemap);
              skyboxPass.SetSkybox(skycubemap);
              {
                setInterval(() => {
                  const radius = 1;
                  const elevationRad = Mathf.Deg2Rad * skyAtmosphere.SUN_ELEVATION_DEGREES;
                  const azimuthRad = Mathf.Deg2Rad * skyAtmosphere.SUN_AZIMUTH_DEGREES;
                  const x = radius * Mathf.Cos(elevationRad) * Mathf.Cos(azimuthRad);
                  const y = radius * Mathf.Sin(elevationRad);
                  const z = radius * Mathf.Cos(elevationRad) * Mathf.Sin(azimuthRad);
                  const sunPos = new Mathf.Vector3(x, y, z);
                  lightGameObject.transform.position = sunPos;
                  lightGameObject.transform.LookAtV1(new Mathf.Vector3(0, 0, 0));
                  skyAtmosphere.Update();
                  iblLightingPass.SetEnvironment(skyAtmosphere.skyTextureCubemap);
                  skyboxPass.SetSkybox(skyAtmosphere.skyTextureCubemap);
                }, 1e3);
                const skySettings = new UIFolder(Debugger.ui, "Sky");
                new UISliderStat(skySettings, "SUN_ELEVATION_DEGREES:", 0, 180, 0.01, skyAtmosphere.SUN_ELEVATION_DEGREES, (value) => skyAtmosphere.SUN_ELEVATION_DEGREES = value);
                new UISliderStat(skySettings, "SUN_AZIMUTH_DEGREES:", 0, 180, 0.01, skyAtmosphere.SUN_AZIMUTH_DEGREES, (value) => skyAtmosphere.SUN_AZIMUTH_DEGREES = value);
                new UISliderStat(skySettings, "EYE_ALTITUDE:", 0, 1e3, 0.01, skyAtmosphere.EYE_ALTITUDE, (value) => skyAtmosphere.EYE_ALTITUDE = value);
                skySettings.Open();
              }
              const terrainGameObject = new GameObject();
              const terrain = terrainGameObject.AddComponent(Terrain);
              terrain.terrainData.Resize(3e3, 2e3, 3e3);
              const shadow = await GLTFLoader.Load("./assets/models/Shadow.glb", scene);
              controls.center.copy(shadow.transform.position);
              {
                const blankAlbedo = GPU.RenderTexture.Create(1, 1, 1, "bgra8unorm");
                blankAlbedo.SetData(new Uint8Array([255, 255, 255, 255]), 4);
                terrain.material.terrainLayers = [
                  // // CLIFF
                  // await PBR({ albedoURL: `${base}/Marble_Cliff_03/marble_cliff_03_diff_2k.jpg`, normalURL: `${base}/Marble_Cliff_03/marble_cliff_03_nor_gl_2k.jpg`, armURL: `${base}/Marble_Cliff_03/marble_cliff_03_arm_2k.jpg` }),
                  // // DIRT
                  // await PBR({ albedoURL: `${base}/Dirt/dirt_diff_2k.jpg`, normalURL: `${base}/Dirt/dirt_nor_gl_2k.jpg`, armURL: `${base}/Dirt/dirt_arm_2k.jpg` }),
                  // // GRASS
                  // await PBR({ albedoURL: `${base}/Leafy_Grass/leafy_grass_diff_2k.jpg`, normalURL: `${base}/Leafy_Grass/leafy_grass_nor_gl_2k.jpg`, armURL: `${base}/Leafy_Grass/leafy_grass_arm_2k.jpg` }),
                  // // SNOW
                  // await PBR({ albedoURL: `${base}/Snow_02/snow_02_diff_2k.jpg`, normalURL: `${base}/Snow_02/snow_02_nor_gl_2k.jpg`, armURL: `${base}/Snow_02/snow_02_arm_2k.jpg` }),
                  // // Sand
                  // await PBR({ albedoURL: `${base}/Sand_03/sand_03_diff_2k.jpg`, normalURL: `${base}/Sand_03/sand_03_nor_gl_2k.jpg`, armURL: `${base}/Sand_03/sand_03_arm_2k.jpg` }),
                  // // Water
                  // await PBR({ albedoURL: `${base}/Coral_Ground_02/coral_ground_02_diff_2k.jpg`, normalURL: `${base}/Coral_Ground_02/coral_ground_02_nor_gl_2k.jpg`, armURL: `${base}/Coral_Ground_02/coral_ground_02_arm_2k.jpg` }),
                  // {name: "LAYER_OCEAN_COLOR", albedoColor: new Mathf.Color(0.02, 0.10, 0.22)},
                  // {name: "LAYER_BEACH_COLOR", albedoColor: new Mathf.Color(0.82, 0.74, 0.52)},
                  // {name: "LAYER_SCORCHED_COLOR", albedoColor: new Mathf.Color(0.35, 0.33, 0.32)},
                  // {name: "LAYER_BARE_COLOR", albedoColor: new Mathf.Color(0.48, 0.43, 0.38)},
                  // {name: "LAYER_TUNDRA_COLOR", albedoColor: new Mathf.Color(0.62, 0.66, 0.58)},
                  // {name: "LAYER_SNOW_COLOR", albedoColor: new Mathf.Color(0.92, 0.92, 0.88)},
                  // {name: "LAYER_TEMPERATE_DESERT_COLOR", albedoColor: new Mathf.Color(0.76, 0.66, 0.42)},
                  // {name: "LAYER_SHRUBLAND_COLOR", albedoColor: new Mathf.Color(0.50, 0.56, 0.34)},
                  // {name: "LAYER_TAIGA_COLOR", albedoColor: new Mathf.Color(0.28, 0.42, 0.34)},
                  // {name: "LAYER_GRASSLAND_COLOR", albedoColor: new Mathf.Color(0.46, 0.62, 0.28)},
                  // {name: "LAYER_TEMPERATE_DECIDUOUS_FOREST_COLOR", albedoColor: new Mathf.Color(0.22, 0.46, 0.20)},
                  // {name: "LAYER_TEMPERATE_RAIN_FOREST_COLOR", albedoColor: new Mathf.Color(0.16, 0.36, 0.18)},
                  // {name: "LAYER_SUBTROPICAL_DESERT_COLOR", albedoColor: new Mathf.Color(0.86, 0.72, 0.36)},
                  // {name: "LAYER_TROPICAL_SEASONAL_FOREST_COLOR", albedoColor: new Mathf.Color(0.18, 0.50, 0.16)},
                  // {name: "LAYER_TROPICAL_RAIN_FOREST_COLOR", albedoColor: new Mathf.Color(0.06, 0.32, 0.10)},
                  { name: "LAYER_OCEAN", albedoColor: new Mathf.Color(0.02, 0.1, 0.22, 0) },
                  { name: "LAYER_BEACH", albedoColor: new Mathf.Color(0.63, 0.56, 0.47, 1) },
                  { name: "LAYER_DESERT", albedoColor: new Mathf.Color(0.8, 0.75, 0.55, 2) },
                  { name: "LAYER_GRASSLAND", albedoColor: new Mathf.Color(0.53, 0.67, 0.33, 3) },
                  { name: "LAYER_FOREST", albedoColor: new Mathf.Color(0.4, 0.58, 0.35, 4) },
                  { name: "LAYER_RAINFOREST", albedoColor: new Mathf.Color(0.2, 0.47, 0.33, 5) },
                  { name: "LAYER_ROCK", albedoColor: new Mathf.Color(0.45, 0.45, 0.45, 6) },
                  { name: "LAYER_TUNDRA", albedoColor: new Mathf.Color(0.73, 0.73, 0.67, 7) },
                  { name: "LAYER_SNOW", albedoColor: new Mathf.Color(1, 1, 1, 8) }
                ];
                const terrainGameObject2 = new GameObject();
                const terrainProcedural = terrainGameObject2.AddComponent(TerrainProcedural);
                terrainProcedural.params.RESOLUTION = 2048;
                terrainProcedural.terrain = terrain;
                await terrainProcedural.Generate();
                const materialIdMapDebug = new UITextureViewer(Debugger.ui, "MaterialID", terrainProcedural.materialIdMap);
                {
                  Component.Registry.set(LODGroup.type, LODGroup);
                  const PrefabFromGameObject = (go) => {
                    const data = Serializer.serializeGameObject(go);
                    return Prefab.Deserialize(go.assetPath ?? "", data, data);
                  };
                  const gameObject = new GameObject();
                  const lodGroup = gameObject.AddComponent(LODGroup);
                  lodGroup.lods.push({ screenSize: 1e9, renderers: [{ geometry: Geometry.Cube(), material: new PBRMaterial() }] });
                  const prefab = PrefabFromGameObject(gameObject);
                  await terrain.terrainData.AddProp(prefab, terrain.gameObject);
                  {
                    async function addLOD(url, options = { enableShadows: false }) {
                      const loadedGO = await GLTFLoader.Load(url, scene);
                      let lodGroupEntries = [];
                      const meshes = loadedGO.GetComponentsInChildren(Components.Mesh);
                      for (const mesh of meshes) {
                        const mat = mesh.material;
                        const clonedMat = new PBRMaterial({ ...mat.params, doubleSided: true, alphaCutoff: 0.5 });
                        lodGroupEntries.push({ geometry: mesh.geometry, material: clonedMat });
                      }
                      loadedGO.enabled = false;
                      console.log(lodGroupEntries);
                      const lodGameObject = new GameObject();
                      const lodInstanceRenderable = lodGameObject.AddComponent(InstancedLODGroup);
                      lodInstanceRenderable.enableShadows = options.enableShadows;
                      if (lodGroupEntries.length > 0) lodInstanceRenderable.lods.push({ renderers: lodGroupEntries.slice(0, 2), screenSize: 2.1 });
                      if (lodGroupEntries.length > 1) lodInstanceRenderable.lods.push({ renderers: lodGroupEntries.slice(2, 4), screenSize: 1.5 });
                      if (lodGroupEntries.length > 2) lodInstanceRenderable.lods.push({ renderers: lodGroupEntries.slice(4, 6), screenSize: 0.3 });
                      if (lodGroupEntries.length > 3) lodInstanceRenderable.lods.push({ renderers: lodGroupEntries.slice(6, 7), screenSize: 0.03 });
                      return lodInstanceRenderable;
                    }
                    const instancedLOD = await addLOD("/extra/test-assets/NatureManufacture Assets/Forest Environment Dynamic Nature/Beech Trees/prefab_beech_tree_05.glb", { enableShadows: false });
                    console.log(instancedLOD);
                    const props = terrain.terrainData.paintPropData;
                    const cubeILG = props[props.length - 1].instancedLODGroup;
                    cubeILG.gameObject.RemoveComponent(cubeILG);
                    props[props.length - 1].instancedLODGroup = instancedLOD;
                  }
                }
                const terrainProceduralProp = terrainGameObject2.AddComponent(TerrainProceduralProp);
                terrainProceduralProp.terrain = terrain;
                await terrainProceduralProp.Generate(terrainProcedural.terrainTexture, terrainProcedural.materialIdMap);
                const updateTerrainParam = async (param, value) => {
                  terrainProcedural.params[param] = value;
                  await terrainProcedural.Generate();
                  await materialIdMapDebug.Update();
                };
                const terrainSettings = new UIFolder(Debugger.ui, "Terrain settings");
                terrainSettings.Open();
                new UISliderStat(terrainSettings, "SEED:", 0, 1e4, 1, terrainProcedural.params.SEED, async (value) => {
                  updateTerrainParam("SEED", value);
                });
                new UISliderStat(terrainSettings, "EROSION_SCALE:", 0, 1, 0.01, terrainProcedural.params.EROSION_SCALE, async (value) => {
                  updateTerrainParam("EROSION_SCALE", value);
                });
                new UISliderStat(terrainSettings, "EROSION_STRENGTH:", 0, 1, 0.01, terrainProcedural.params.EROSION_STRENGTH, async (value) => {
                  updateTerrainParam("EROSION_STRENGTH", value);
                });
                new UISliderStat(terrainSettings, "EROSION_SLOPE_POWER:", 0, 1, 0.01, terrainProcedural.params.EROSION_SLOPE_POWER, async (value) => {
                  updateTerrainParam("EROSION_SLOPE_POWER", value);
                });
                new UISliderStat(terrainSettings, "EROSION_CELL_SCALE:", 0, 2, 0.01, terrainProcedural.params.EROSION_CELL_SCALE, async (value) => {
                  updateTerrainParam("EROSION_CELL_SCALE", value);
                });
                new UISliderStat(terrainSettings, "EROSION_HEIGHT_OFFSET:", -1, 1, 0.01, terrainProcedural.params.EROSION_HEIGHT_OFFSET, async (value) => {
                  updateTerrainParam("EROSION_HEIGHT_OFFSET", value);
                });
                new UISliderStat(terrainSettings, "EROSION_OCTAVES:", 0, 10, 1, terrainProcedural.params.EROSION_OCTAVES, async (value) => {
                  updateTerrainParam("EROSION_OCTAVES", value);
                });
                new UISliderStat(terrainSettings, "EROSION_GAIN:", 0, 1, 0.01, terrainProcedural.params.EROSION_GAIN, async (value) => {
                  updateTerrainParam("EROSION_GAIN", value);
                });
                new UISliderStat(terrainSettings, "EROSION_LACUNARITY:", 0, 10, 0.1, terrainProcedural.params.EROSION_LACUNARITY, async (value) => {
                  updateTerrainParam("EROSION_LACUNARITY", value);
                });
                new UISliderStat(terrainSettings, "HEIGHT_TILES:", 0, 10, 0.1, terrainProcedural.params.HEIGHT_TILES, async (value) => {
                  updateTerrainParam("HEIGHT_TILES", value);
                });
                new UISliderStat(terrainSettings, "HEIGHT_OCTAVES:", 0, 10, 1, terrainProcedural.params.HEIGHT_OCTAVES, async (value) => {
                  updateTerrainParam("HEIGHT_OCTAVES", value);
                });
                new UISliderStat(terrainSettings, "HEIGHT_AMP:", 0, 1, 0.01, terrainProcedural.params.HEIGHT_AMP, async (value) => {
                  updateTerrainParam("HEIGHT_AMP", value);
                });
                new UISliderStat(terrainSettings, "HEIGHT_GAIN:", 0, 1, 0.01, terrainProcedural.params.HEIGHT_GAIN, async (value) => {
                  updateTerrainParam("HEIGHT_GAIN", value);
                });
                new UISliderStat(terrainSettings, "HEIGHT_LACUNARITY:", 0, 10, 0.1, terrainProcedural.params.HEIGHT_LACUNARITY, async (value) => {
                  updateTerrainParam("HEIGHT_LACUNARITY", value);
                });
                new UISliderStat(terrainSettings, "WATER_HEIGHT:", 0, 1, 0.01, terrainProcedural.params.WATER_HEIGHT, async (value) => {
                  updateTerrainParam("WATER_HEIGHT", value);
                });
                new UISliderStat(terrainSettings, "SCROLL_X:", -10, 10, 0.01, terrainProcedural.params.TERRAIN_SCROLL_X, async (value) => {
                  updateTerrainParam("TERRAIN_SCROLL_X", value);
                });
                new UISliderStat(terrainSettings, "SCROLL_Y:", -10, 10, 0.01, terrainProcedural.params.TERRAIN_SCROLL_Y, async (value) => {
                  updateTerrainParam("TERRAIN_SCROLL_Y", value);
                });
                new UISliderStat(terrainSettings, "IS_ISLAND:", 0, 1, 1, terrainProcedural.params.IS_ISLAND, async (value) => {
                  updateTerrainParam("IS_ISLAND", value);
                });
                const waterGameObject = new GameObject();
                waterGameObject.transform.eulerAngles.x = -90;
                waterGameObject.transform.scale.set(terrain.terrainData.size.x, terrain.terrainData.size.z, 1);
                waterGameObject.AddComponent(WaterNoise);
                setInterval(() => {
                  const ty = terrain.terrainData.size.y;
                  waterGameObject.transform.position.y = terrainProcedural.params.WATER_HEIGHT * ty;
                  waterGameObject.transform.position.y -= ty * 0.5;
                  terrain.SampleHeight(shadow.transform.position);
                }, 1e3);
              }
              const sphereGameObject = new GameObject();
              sphereGameObject.transform.position.set(0, 30, 0);
              const sphereMesh = sphereGameObject.AddComponent(Components.Mesh);
              sphereMesh.geometry = Geometry.Cube();
              sphereMesh.material = new PBRMaterial();
              Debugger.Enable();
            }
            Application(document.querySelector("canvas"));
            
            </script>
        </body>
    </html>
