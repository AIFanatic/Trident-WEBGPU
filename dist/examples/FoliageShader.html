
    <!DOCTYPE html>
    <html>
        <head>
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
            <meta name="mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta charset="UTF-8">
            
            <style>
                html, body {
                    margin: 0;
                    overflow: hidden;
                    width: 100%;
                    height: 100%;
                }
            </style>
        </head>
        <body>
            <script type="importmap">
                {
                    "imports": {
                        "@trident/core": "../trident-core.js",
                        "@trident/plugins/": "../plugins/"
                    }
                }
            </script>
            <script type="module">
                const canvas = document.createElement("canvas");
                document.body.appendChild(canvas);
                            import { PlayerRuntime, GameObject, Components, Mathf, Runtime, GPU, Geometry, PBRMaterial } from '@trident/core';
            import { OrbitControls } from '@trident/plugins/OrbitControls.js';
            import { GLTFLoader } from '@trident/plugins/GLTF/GLTFLoader.js';
            import { Debugger } from '@trident/plugins/Debugger.js';
            import { IBLLightingPass } from '@trident/plugins/Environment/IBLLightingPass.js';
            import { SkyboxPass } from '@trident/plugins/Environment/SkyboxPass.js';
            import { Sky } from '@trident/plugins/Environment/Sky.js';
            import { FoliageMaterial } from '@trident/plugins/FoliageMaterial.js';
            
            async function Application(canvas) {
              await PlayerRuntime.Create(canvas);
              const scene = PlayerRuntime.SceneManager.CreateScene("DefaultScene");
              PlayerRuntime.SceneManager.SetActiveScene(scene);
              const mainCameraGameObject = new GameObject();
              mainCameraGameObject.transform.position.set(0, 0, 5);
              mainCameraGameObject.name = "MainCamera";
              const camera = mainCameraGameObject.AddComponent(Components.Camera);
              camera.SetPerspective(60, canvas.width / canvas.height, 0.05, 1e4);
              mainCameraGameObject.transform.LookAt(new Mathf.Vector3(0, 0, 0));
              mainCameraGameObject.AddComponent(OrbitControls);
              const lightGameObject = new GameObject();
              lightGameObject.transform.position.set(2, 0, 0);
              lightGameObject.transform.LookAt(new Mathf.Vector3(0, 0, 0));
              const light = lightGameObject.AddComponent(Components.DirectionalLight);
              light.castShadows = false;
              light.intensity = 2;
              const sky = new Sky();
              await sky.init();
              const skyTexture = sky.skyTextureCubemap;
              const iblLightingPass = Runtime.Renderer.RenderPipeline.AddPass(IBLLightingPass, GPU.RenderPassOrder.AfterLighting);
              const skyboxPass = Runtime.Renderer.RenderPipeline.AddPass(SkyboxPass, GPU.RenderPassOrder.AfterLighting);
              iblLightingPass.SetEnvironment(skyTexture);
              skyboxPass.SetSkybox(skyTexture);
              const floorGameObject = new GameObject();
              floorGameObject.transform.scale.set(2e3, 2e3, 0);
              floorGameObject.transform.eulerAngles.x = -90;
              const floorMesh = floorGameObject.AddComponent(Components.Mesh);
              floorMesh.geometry = Geometry.Plane();
              floorMesh.material = new PBRMaterial();
              const rootGO = await GLTFLoader.Load("/extra/SampleProject/GameAssets/Trees/Eucalyptus camaldulensis.glb", scene);
              const meshes = rootGO.GetComponentsInChildren(Components.Mesh);
              console.log(meshes);
              let mesh = meshes[0];
              for (const mesh2 of meshes) console.log(mesh2.material.params.albedoColor);
              mesh.material = new FoliageMaterial(mesh.geometry, mesh.material.params.albedoMap, mesh.material.params.normalMap);
              mesh = meshes[1];
              mesh.material = new FoliageMaterial(mesh.geometry, mesh.material.params.albedoMap, mesh.material.params.normalMap);
              Debugger.Enable();
            }
            Application(document.querySelector("canvas"));
            
            </script>
        </body>
    </html>
