
    <!DOCTYPE html>
    <html>
        <head>
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
            <meta name="mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta charset="UTF-8">
            
            <style>
                html, body {
                    margin: 0;
                    overflow: hidden;
                    width: 100%;
                    height: 100%;
                }
            </style>
        </head>
        <body>
            <script type="importmap">
                {
                    "imports": {
                        "@trident/core": "../trident-core.js",
                        "@trident/plugins/": "../plugins/"
                    }
                }
            </script>
            <script type="module">
                const canvas = document.createElement("canvas");
                document.body.appendChild(canvas);
                            import { PlayerRuntime, GameObject, Components, Runtime, GPU, Geometry, PBRMaterial, Mathf } from '@trident/core';
            import { Debugger } from '@trident/plugins/Debugger.js';
            import { OrbitControls } from '@trident/plugins/OrbitControls.js';
            import { UIFolder, UISliderStat } from '@trident/plugins/ui/UIStats.js';
            import { Sky } from '@trident/plugins/Environment/Sky.js';
            import { IBLLightingPass } from '@trident/plugins/Environment/IBLLightingPass.js';
            import { SkyboxPass } from '@trident/plugins/Environment/SkyboxPass.js';
            import { WaterDynamic } from '@trident/plugins/Water/WaterDynamic.js';
            
            async function Application(canvas) {
              await PlayerRuntime.Create(canvas);
              const scene = PlayerRuntime.SceneManager.CreateScene("DefaultScene");
              PlayerRuntime.SceneManager.SetActiveScene(scene);
              const mainCameraGameObject = new GameObject();
              mainCameraGameObject.transform.position.set(0, 0, 20);
              mainCameraGameObject.name = "MainCamera";
              const camera = mainCameraGameObject.AddComponent(Components.Camera);
              camera.SetPerspective(72, canvas.width / canvas.height, 0.05, 5120);
              mainCameraGameObject.AddComponent(OrbitControls);
              const lightGameObject = new GameObject();
              lightGameObject.transform.eulerAngles.set(-50, -30, 0);
              lightGameObject.AddComponent(Components.DirectionalLight);
              const skyAtmosphere = new Sky();
              await skyAtmosphere.init();
              const skycubemap = skyAtmosphere.skyTextureCubemap;
              const iblLightingPass = Runtime.Renderer.RenderPipeline.AddPass(IBLLightingPass, GPU.RenderPassOrder.AfterLighting);
              const skyboxPass = Runtime.Renderer.RenderPipeline.AddPass(SkyboxPass, GPU.RenderPassOrder.AfterLighting);
              iblLightingPass.SetEnvironment(skycubemap);
              skyboxPass.SetSkybox(skycubemap);
              const sphereGameObject = new GameObject();
              const sphereMesh = sphereGameObject.AddComponent(Components.Mesh);
              sphereMesh.geometry = Geometry.Sphere();
              sphereMesh.material = new PBRMaterial();
              const waterGameObject = new GameObject();
              waterGameObject.transform.eulerAngles.x = -90;
              waterGameObject.transform.position.y = 5;
              waterGameObject.transform.scale.set(1024, 1024, 1);
              waterGameObject.AddComponent(WaterDynamic);
              setInterval(() => {
                const radius = 1;
                const elevationRad = Mathf.Deg2Rad * skyAtmosphere.SUN_ELEVATION_DEGREES;
                const azimuthRad = Mathf.Deg2Rad * skyAtmosphere.SUN_AZIMUTH_DEGREES;
                const x = radius * Mathf.Cos(elevationRad) * Mathf.Cos(azimuthRad);
                const y = radius * Mathf.Sin(elevationRad);
                const z = radius * Mathf.Cos(elevationRad) * Mathf.Sin(azimuthRad);
                const sunPos = new Mathf.Vector3(x, y, z);
                lightGameObject.transform.position = sunPos;
                lightGameObject.transform.LookAt(new Mathf.Vector3(0, 0, 0));
                skyAtmosphere.Update();
                iblLightingPass.SetEnvironment(skycubemap);
                skyboxPass.SetSkybox(skycubemap);
              }, 1e3);
              {
                const skySettings = new UIFolder(Debugger.ui, "Sky");
                new UISliderStat(skySettings, "SUN_ELEVATION_DEGREES:", 0, 180, 0.01, skyAtmosphere.SUN_ELEVATION_DEGREES, (value) => skyAtmosphere.SUN_ELEVATION_DEGREES = value);
                new UISliderStat(skySettings, "SUN_AZIMUTH_DEGREES:", 0, 180, 0.01, skyAtmosphere.SUN_AZIMUTH_DEGREES, (value) => skyAtmosphere.SUN_AZIMUTH_DEGREES = value);
                new UISliderStat(skySettings, "EYE_ALTITUDE:", 0, 1e3, 0.01, skyAtmosphere.EYE_ALTITUDE, (value) => skyAtmosphere.EYE_ALTITUDE = value);
                skySettings.Open();
              }
              const offset = 10;
              const i = 5;
              for (let x = 0; x < i; x++) {
                for (let y = 0; y < i; y++) {
                  const lightGameObject2 = new GameObject();
                  lightGameObject2.transform.position.set(x * offset - i * 0.5 * 2, 6, y * offset - i * 0.5 * 2);
                  const look = lightGameObject2.transform.position.clone();
                  look.y -= 1;
                  lightGameObject2.transform.LookAt(look);
                  const light2 = lightGameObject2.AddComponent(Components.PointLight);
                  light2.color.set(Math.random(), Math.random(), Math.random(), 1);
                  light2.range = 20;
                  light2.intensity = 10;
                  light2.castShadows = false;
                  const sphereGameObject2 = new GameObject();
                  sphereGameObject2.transform.position.copy(lightGameObject2.transform.position);
                  const sphereMesh2 = sphereGameObject2.AddComponent(Components.Mesh);
                  sphereMesh2.geometry = Geometry.Sphere();
                  sphereMesh2.material = new PBRMaterial({ albedoColor: light2.color, emissiveColor: light2.color, unlit: false });
                }
              }
              {
                const planeGO = new GameObject();
                planeGO.transform.eulerAngles.x = -90;
                planeGO.transform.position.set(0, 3, 0);
                planeGO.transform.scale.set(10, 10, 1);
                const sphereMesh2 = planeGO.AddComponent(Components.Mesh);
                sphereMesh2.geometry = Geometry.Plane();
                const mat = new PBRMaterial({ albedoColor: new Mathf.Color(1, 1, 1), metalness: 0, roughness: 1 });
                sphereMesh2.material = mat;
              }
              {
                const planeGO = new GameObject();
                planeGO.transform.eulerAngles.x = -45;
                planeGO.transform.position.set(10, -5, 0);
                planeGO.transform.scale.set(10, 20, 1);
                const sphereMesh2 = planeGO.AddComponent(Components.Mesh);
                sphereMesh2.geometry = Geometry.Plane();
                const mat = new PBRMaterial({ albedoColor: new Mathf.Color(1, 1, 1), metalness: 0, roughness: 1 });
                sphereMesh2.material = mat;
              }
              Debugger.Enable();
            }
            Application(document.querySelector("canvas"));
            
            </script>
        </body>
    </html>
