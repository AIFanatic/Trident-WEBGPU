
    <!DOCTYPE html>
    <html>
        <head>
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
            <meta name="mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta charset="UTF-8">
            
            <style>
                html, body {
                    margin: 0;
                    overflow: hidden;
                    width: 100%;
                    height: 100%;
                }
            </style>
        </head>
        <body>
            <script type="importmap">
                {
                    "imports": {
                        "@trident/core": "../trident-core.js",
                        "@trident/plugins/": "../plugins/"
                    }
                }
            </script>
            <script type="module">
                const canvas = document.createElement("canvas");
                document.body.appendChild(canvas);
                            import { PlayerRuntime, GameObject, Components, Mathf, Runtime, GPU, PBRMaterial } from '@trident/core';
            import { OrbitControls } from '@trident/plugins/OrbitControls.js';
            import { OBJLoaderIndexed } from '@trident/plugins/OBJLoader.js';
            import { MeshletDraw } from '@trident/plugins/meshlets/passes/MeshletDraw.js';
            import { HDRParser } from '@trident/plugins/HDRParser.js';
            import { IBLLightingPass } from '@trident/plugins/Environment/IBLLightingPass.js';
            import { SkyboxPass } from '@trident/plugins/Environment/SkyboxPass.js';
            import { InstancedMeshletMesh } from '@trident/plugins/meshlets/InstancedMeshletMesh.js';
            
            async function Application(canvas) {
              await PlayerRuntime.Create(canvas);
              const scene = PlayerRuntime.SceneManager.CreateScene("DefaultScene");
              PlayerRuntime.SceneManager.SetActiveScene(scene);
              const mainCameraGameObject = new GameObject();
              mainCameraGameObject.transform.position.set(0, 0, -15);
              mainCameraGameObject.name = "MainCamera";
              const camera = mainCameraGameObject.AddComponent(Components.Camera);
              camera.SetPerspective(60, canvas.width / canvas.height, 0.05, 1e3);
              mainCameraGameObject.transform.position.set(0, 0, 5);
              mainCameraGameObject.transform.LookAt(new Mathf.Vector3(0, 0, 0));
              mainCameraGameObject.AddComponent(OrbitControls);
              Runtime.Renderer.RenderPipeline.AddPass(new MeshletDraw(), GPU.RenderPassOrder.BeforeGBuffer);
              const lightGameObject = new GameObject();
              lightGameObject.transform.position.set(-4, 4, 4);
              lightGameObject.transform.LookAt(new Mathf.Vector3(0, 0, 0));
              const light = lightGameObject.AddComponent(Components.DirectionalLight);
              light.intensity = 20;
              light.color.set(1, 1, 1, 1);
              light.castShadows = true;
              {
                const mesh = await OBJLoaderIndexed.load("/extra/test-assets/lucy.obj");
                mesh.geometry.ComputeNormals();
                mesh.geometry.ComputeTangents();
                const mat = new PBRMaterial({ albedoMap: await GPU.Texture.Load("./assets/textures/T_OmniDebugTexture_COL.jpg") });
                const c = 10;
                const off = 100;
                const total = c * c * c;
                const go = new GameObject();
                const meshletInstanced = go.AddComponent(InstancedMeshletMesh);
                meshletInstanced.geometry = mesh.geometry;
                meshletInstanced.material = mat;
                console.log(meshletInstanced);
                let j = 0;
                for (const m2 of meshletInstanced.meshlets) if (m2.lod === 0) j++;
                console.log(j);
                const p = new Mathf.Vector3();
                const q = new Mathf.Quaternion();
                const s = new Mathf.Vector3(1, 1, 1);
                const m = new Mathf.Matrix4();
                const matrices = new Float32Array(total * 16);
                let i = 0;
                for (let x = 0; x < c; x++) {
                  for (let y = 0; y < c; y++) {
                    for (let z = 0; z < c; z++) {
                      p.set(x * off, y * off, z * off);
                      m.compose(p, q, s);
                      matrices.set(m.elements, i * 16);
                      i++;
                    }
                  }
                }
                meshletInstanced.SetMatricesBulk(matrices);
              }
              const hdr = await HDRParser.Load("./assets/textures/HDR/autumn_field_puresky_1k.hdr");
              const skyTexture = await HDRParser.ToCubemap(hdr);
              const iblLightingPass = Runtime.Renderer.RenderPipeline.AddPass(IBLLightingPass, GPU.RenderPassOrder.AfterLighting);
              const skyboxPass = Runtime.Renderer.RenderPipeline.AddPass(SkyboxPass, GPU.RenderPassOrder.AfterLighting);
              iblLightingPass.SetEnvironment(skyTexture);
              skyboxPass.SetSkybox(skyTexture);
            }
            Application(document.querySelector("canvas"));
            
            </script>
        </body>
    </html>
